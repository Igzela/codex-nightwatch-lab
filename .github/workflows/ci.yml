name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run compileall
        run: python -m compileall -q nightwatch
      - name: Run unit tests
        run: python -m unittest discover -s nightwatch/tests -v
      - name: Check git diff
        run: git diff --check
      - name: Install package
        run: python -m pip install ./nightwatch
      - name: Verify CLI version
        run: nightwatch --version
