[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwatch"
version = "0.3.0"
description = "Linux-first, Codex-only, fail-closed unattended supervisor"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["nightwatch"]

[tool.setuptools.package-data]
nightwatch = ["nightwatch.service"]

[project.scripts]
nightwatch = "nightwatch.cli:main"
